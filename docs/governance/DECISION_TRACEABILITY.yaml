      ],
      "implementation_evidence": "docs/governance/STATUS.md",
      "approval_gate": "docs/governance/STAGE_GATES.md",
      "conflicts": []
    },
    {
      "id": "X-004",
      "status": "DECIDED",
      "line": 204,
      "clause": "**DECIDED — X-004. Agent-ready interface.** Maintain machine-readable OpenAPI schemas for public/partner access where permitted and explore an MCP-facing adapter as a secondary distribution surface. Read-only tools (service discovery, details, eligibility, availability with freshness/provenance) are distinct from write tools (quote, request, confirm, cancel). Auth, scopes, partner permissions, user consent, usage quotas and audit are mandatory before external agent access. A tool schema alone is not an externally accessible service.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
