      "conflicts": []
    },
    {
      "id": "X-005",
      "status": "DECIDED",
      "line": 206,
      "clause": "**DECIDED — X-005. Honest transactions.** Distinguish VERIFIED_CONTACT, INFORMATION_ONLY, REDIRECT_TO_PROVIDER, REQUESTED, PENDING_PARTNER, CONFIRMED, DECLINED, EXPIRED, CANCELLED, COMPLETED. Fulfillment must come from an authorized source. SIM/eSIM purchase and activation, transportation reservations and payments can have different provider/legal obligations; never simulate activation/availability/confirmation. No raw payment data handling or unapproved booking writes.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
      "interfaces": [
