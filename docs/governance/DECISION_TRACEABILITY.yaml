        "CF-01"
      ]
    },
    {
      "id": "E-001",
      "status": "TO VALIDATE",
      "line": 129,
      "clause": "**TO VALIDATE — E-001.** Tourist benefit: faster and easier **constraint-valid selection**, understandable comparisons and lower search friction. Better experienced venue/service quality and post-visit satisfaction are outside the primary MVP claim.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
