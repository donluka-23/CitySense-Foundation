    {
      "id": "X-010",
      "status": "PROPOSED",
      "line": 216,
      "clause": "**PROPOSED — X-010. Phased implementation.** Phase A: schema and interfaces compatible with the current registry, read-only service discovery and verified contacts, no agent write tools. Phase B: partner-verified availability/request workflows for one narrow segment. Phase C: eSIM/private transfer partner integrations following signed terms, legal review and provider sandbox tests. Phase D: independently authorized external agent API/MCP actions, tenant scopes and monitored production reliability. Stages require founder gates; they are not automatic scope for November.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
