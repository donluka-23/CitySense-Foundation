    {
      "id": "P-006",
      "status": "DECIDED",
      "line": 250,
      "clause": "**P-006 DECIDED:** UI/UX and cartographic presentation require visual founder approval at distinct design checkpoints before broad production implementation. Review must use genuine rendered previews and reproducible demos where available, at representative mobile/desktop viewports, with realistic and rights-compliant Batumi data; no fabricated map evidence. Design quality and usability are separate acceptance dimensions from code correctness.",
      "decision_owner": "Founder",
      "accountable_role": "mobile_pwa",
