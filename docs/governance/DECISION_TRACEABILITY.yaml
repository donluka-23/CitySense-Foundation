      "status": "DECIDED",
      "line": 77,
      "clause": "**DECIDED — R-009.** Candidate retrieval must not accidentally discard superior eligible options due to arbitrary ID ordering or an early fixed limit. Define a measurable retrieval/coverage policy, then apply hard-constraint verification, suitability ranking, bounded diversity when relevant, and only then the conditional partner policy in R-002. Diversity must not contradict an explicit narrow user interest.",
