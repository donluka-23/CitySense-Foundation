    {
      "id": "V-004",
      "status": "PROPOSED",
      "line": 109,
      "clause": "**PROPOSED — V-004.** Compare matched decision tasks against each participant's ordinary Maps/AI/host-advice workflow, measuring VDCR/violations, decision time and UX errors. Account for order effects and unequal information access. With the likely small Orbi City sample, report exploratory results and uncertainty, not statistical superiority.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
