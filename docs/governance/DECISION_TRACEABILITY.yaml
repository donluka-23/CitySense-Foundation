    {
      "id": "P-005",
      "status": "DECIDED",
      "line": 248,
      "clause": "**P-005 DECIDED:** CitySense development uses sequential founder-controlled stage gates: scope approved first, work performed within that scope, technical QA, founder evaluation of concrete outcomes, and explicit approval before the next stage. No agent, including the Chief Engineer, may infer approval from silence, reports, green tests or roadmap position. Approval is specific to stage and artifact version; changed requirements need a new recorded decision.",
      "decision_owner": "Founder",
      "accountable_role": "chief_engineer",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
