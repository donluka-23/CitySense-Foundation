      ],
      "implementation_evidence": "docs/governance/STATUS.md",
      "approval_gate": "docs/governance/STAGE_GATES.md",
      "conflicts": []
    },
    {
      "id": "X-003",
      "status": "DECIDED",
      "line": 202,
      "clause": "**DECIDED — X-003. Single domain core, multiple clients.** Mobile PWA, Telegram bot/Mini App, partner workspace and future external AI agents should consume versioned, governed service/action APIs, not separately implement availability, ranking, booking or entitlements. A provider adapter / connector layer separates external inventory and fulfillment from the domain model. Do not prematurely build a generic plug-in runtime or force every domain into an impoverished single schema.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
      "interfaces": [
        "SERVICES_READ",
