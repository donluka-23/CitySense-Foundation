    {
      "id": "E-004",
      "status": "TO VALIDATE",
      "line": 135,
      "clause": "**TO VALIDATE — E-004.** QR rooms offer a bounded acquisition experiment, not proven scalable distribution. Hotel/operator permission, economics, churn and permission to message visitors require separate validation.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
