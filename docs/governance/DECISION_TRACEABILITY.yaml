      "conflicts": []
    },
    {
      "id": "X-007",
      "status": "DECIDED",
      "line": 210,
      "clause": "**DECIDED — X-007. Human relevance over promotion.** Services can be candidates only if they genuinely fit a stated need and hard constraints; paid inventory must not bypass evidence and ranking rules. Disclose commercial relationships and price/availability uncertainty. Do not infer personalization attributes or collect location/identity beyond the purpose and consent.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
