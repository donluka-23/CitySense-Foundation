      "clause": "**DECIDED — R-004.** A card selection synchronizes a persistent shared UI state, focuses the MapLibre/MapTiler map on the exact place/entrance, animates camera zoom/pitch only as feasible and accessible, and visually highlights the selected point/object. High-quality **3D-looking emphasis** is an interaction goal; custom 3D geometry is not a prerequisite. Do not imply a 3D building exists where map data does not supply one.",
