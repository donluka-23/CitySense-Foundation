      "status": "TO VALIDATE",
      "line": 37,
      "clause": "**TO VALIDATE — G-005.** Relative to tourists' ordinary Google Maps / AI assistant / host-advice workflow, CitySense helps people reach a **constraint-valid, informed selection** more easily and efficiently: fewer steps, less time, clearer comparison and fewer verifiable constraint violations. This is not a claim of superior venue-service quality or post-visit satisfaction.",
