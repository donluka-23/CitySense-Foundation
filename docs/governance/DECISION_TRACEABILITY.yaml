    {
      "id": "X-002",
      "status": "DECIDED",
      "line": 200,
      "clause": "**DECIDED — X-002. Expandable service taxonomy.** Initial architecture must be capable of representing: travel eSIM/SIM offers and activation links; licensed/private tour operators; authorized drivers, private transfers and transport contacts; destination and partner contact details; paid experiences/sports facilities; future city-specific digital services. Each concrete category's product scope and implementation remains PROPOSED or DEFERRED until prioritized. No implicit assumption that independent drivers or tour providers are licensed, insured, available, or willing to contract.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
      "interfaces": [
        "SERVICES_READ",
        "ACTIONS_CALLBACK",
