    {
      "id": "V-005",
      "status": "TO VERIFY",
      "line": 111,
      "clause": "**TO VERIFY — V-005.** Lawful, privacy-minimizing event collection; any consent/notice requirements; room-group-level QR attribution without unnecessary person-level identification; opt-out/withdrawal and deletion policy; data retention and access control. Never collect continuous location tracking by default.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
