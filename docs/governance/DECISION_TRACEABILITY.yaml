    {
      "id": "X-009",
      "status": "PROPOSED",
      "line": 214,
      "clause": "**PROPOSED — X-009. Connector lifecycle and trust.** `DISCOVERED -> CONTACTED -> APPROVED -> TESTING -> ACTIVE -> SUSPENDED/REVOKED`; per-connector capability negotiation, sandbox contract tests, inventory freshness, error handling, rate limits, rights records and revocation. Do not publish partner contact details or integrate private endpoints without authorization.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
