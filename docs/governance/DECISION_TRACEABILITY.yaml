      "status": "DECIDED",
      "line": 75,
      "clause": "**DECIDED — R-008.** The system supports **informed user choice**, not an objective claim to find the psychologically or experientially \"best\" venue. Present up to five credible, high-relevance options as the initial shortlist, with transparent differences and user-controlled reordering/refinement; support additional eligible results without unnecessary repeats. Never imply a mathematically calibrated probability of \"best\" unless independently modeled and validated.",
