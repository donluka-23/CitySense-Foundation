      "id": "R-001",
      "status": "DECIDED",
      "line": 61,
      "clause": "**DECIDED — R-001.** Stage 1: validate required user constraints and build an eligible set using interest/intent, budget, time budget, mobility/accessibility requirements, actual place coordinates/entrances, travel feasibility, operational availability, and credible city conditions where available. Distinguish required constraints from soft preferences. If evidence cannot establish a hard safety/access constraint, do not state that it is satisfied.",
      "decision_owner": "Founder",
      "accountable_role": "decision_engine",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
