    {
      "id": "P-007",
      "status": "DECIDED",
      "line": 252,
      "clause": "**P-007 DECIDED:** Scope changes and new ideas must be logged, evaluated for impact across modules and approved before entering implementation. The Chief Engineer curates dependency-aware stage packets and a durable decision record; specialist agents cannot change accepted product outcomes through incidental technical decisions.",
