      "id": "R-010",
      "status": "DECIDED",
      "line": 79,
      "clause": "**DECIDED — R-010.** Validation is layered: (a) **constraint validity** for known, independently checkable requirements; (b) **comparative relevance** using documented criteria and, where appropriate, blinded human review; (c) **choice-interface efficiency and usability**. Unknown critical facts must not be silently counted as satisfied, and an abstention is preferable to a fabricated fifth suggestion. The overall 0–100 suitability score and \"probability of best experience\" are not empirically calibrated without separate studies.",
      "decision_owner": "Founder",
      "accountable_role": "decision_engine",
