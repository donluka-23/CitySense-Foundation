      "conflicts": []
    },
    {
      "id": "V-006",
      "status": "DECIDED",
      "line": 113,
      "clause": "**DECIDED — V-006.** Keep three outcome classes separate: (1) **verified decision validity** and decision efficiency (MVP core), (2) **self-reported or inferred user action** (secondary), and (3) **provider-confirmed fulfilled booking/payment** (commercial outcome, unavailable without partner/provider evidence). Do not claim any of these establishes the quality of the consumed service or causal incrementality by itself.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
      "interfaces": [
