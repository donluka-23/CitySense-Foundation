    {
      "id": "R-002",
      "status": "DECIDED",
      "line": 63,
      "clause": "**DECIDED — R-002.** Stage 2: rank by user suitability without partner status changing the underlying suitability score. Only within **materially equivalent suitable alternatives** may eligible partner options receive an additional **transparent commercial priority**. Equivalence tolerance/policy is **TO VALIDATE**, not an invented fixed score delta. Paid/partner ranking influence must not be presented as an organic quality signal; disclosure and applicable consumer rules must be reviewed.",
      "decision_owner": "Founder",
      "accountable_role": "decision_engine",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
