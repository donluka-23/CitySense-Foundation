      "conflicts": []
    },
    {
      "id": "E-002",
      "status": "TO VALIDATE",
      "line": 131,
      "clause": "**TO VALIDATE — E-002.** Partner benefit: verified **incremental** bookings/visits, filled unused capacity, improved qualified leads; net benefit must account for discounts, commissions, service cost, no-shows and cannibalization.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
