      "status": "PROPOSED",
      "line": 107,
      "clause": "**PROPOSED — V-003.** Secondary funnel metrics include QR scan-to-start, prompt submission, shortlist render, priority/filter change, cards compared, map focus/highlight, detail view, selection, route opened, contact/booking intent, and partner-confirmed commercial conversion **only where independent confirmation exists**. Define precise event schemas, denominators, duplicate-session handling, retention, missing-response rates and participant privacy boundaries before instrumentation. Clicks and route launches are behavioral signals, not verified visits or service satisfaction.",
