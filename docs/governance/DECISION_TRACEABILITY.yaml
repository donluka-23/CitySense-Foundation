    {
      "id": "X-008",
      "status": "PROPOSED",
      "line": 212,
      "clause": "**PROPOSED — X-008. Capability-oriented service contract.** Model a `ServiceOffering` connected to a `Provider`, `Place` or service area, `Capability`, `PriceQuote`, `AvailabilityAssertion`, `ContactChannel`, `ActionPolicy` and `EvidenceRecord`. Distinguish place-based offerings (court), mobile/on-demand services (driver), remote/digital services (eSIM) and informational contact listings; do not require all offerings to have a single geographic point. Extend through category-specific validated attributes rather than dozens of nullable universal columns.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
