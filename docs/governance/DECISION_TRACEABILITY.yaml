      "status": "DECIDED",
      "line": 94,
      "clause": "**DECIDED — V-001 (supersedes v0.1).** The primary closed-pilot hypothesis is that CitySense helps a tourist **identify and select an option that satisfies their explicit, objectively checkable requirements, using a fast, understandable and visually effective comparison process**. Quality of the service eventually delivered by an attraction, tour operator, café or sports venue, psychological utility and post-visit satisfaction are **not primary MVP KPIs**. They may be collected separately as exploratory feedback, not represented as proof of ranking accuracy.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
