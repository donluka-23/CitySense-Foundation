    {
      "id": "X-001",
      "status": "DECIDED",
      "line": 198,
      "clause": "**DECIDED — X-001. Platform extensibility.** CitySense must be designed as an extensible **place × service × provider × availability × action** platform, not a hardcoded list of tourism categories. This is an architectural requirement, not a claim that the integrations exist or have commercial agreements. Preserve the November pilot's narrower core user journey.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
