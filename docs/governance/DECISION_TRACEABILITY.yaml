      "status": "DECIDED",
      "line": 65,
      "clause": "**DECIDED — R-003.** Following a natural-language request, the interface presents **five alternatives as the desired default** and allows active user choice and comparison. **Safety fallback:** if fewer than five defensible, feasible candidates exist, show fewer and explain why; never fabricate or relax hard constraints to fill five slots.",
      "decision_owner": "Founder",
      "accountable_role": "decision_engine",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
