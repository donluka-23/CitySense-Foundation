      "id": "P-001",
      "status": "DECIDED",
      "line": 19,
      "clause": "**DECIDED — P-001.** CitySense is a context-aware urban discovery, decision-support, and experience-action platform, initially for **tourists in Batumi**. It matches individual needs, location, time, and credible city conditions to suitable places/activities; provides understandable alternatives, mapping, travel feasibility, and routes; and can connect users to bookings or partner offers. It must not devolve into a generic tourist chatbot, directory, coupon catalogue, or sensor dashboard.",
      "decision_owner": "Founder",
      "accountable_role": "product_research",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
      "interfaces": [
        "REQUEST_SELECTION",
        "REST_PRIVATE_V1"
