      "conflicts": []
    },
    {
      "id": "X-006",
      "status": "DECIDED",
      "line": 208,
      "clause": "**DECIDED — X-006. Multi-city design without premature rollout.** City-dependent providers, locales, currencies, taxonomies, map coverage, law, rights and service-area geometry must be configurable by city/market. Stable globally unique entity IDs, versioned schemas, geo/timezones/currency and source provenance are essential. Batumi remains the only initial pilot market. No global scale claim until interoperability, supply acquisition, costs and regional legal feasibility are demonstrated.",
      "decision_owner": "Founder",
      "accountable_role": "service_integrations",
      "source": "docs/product/CITYSENSE_PRODUCT_BLUEPRINT_v0_4.md",
      "status_origin": "inherited unchanged from v0.3",
