name: CitySense quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    env:
      CITYSENSE_TEST_DATABASE_URL: postgresql://citysense@127.0.0.1:5432/citysense_test
      CITYSENSE_REQUIRE_DB: '1'
    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_USER: citysense
          POSTGRES_DB: citysense_test
          # Disposable CI runner only, loopback-bound, without committed credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd 'pg_isready -U citysense -d citysense_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Locked install
        run: |
          python -m pip install uv==0.12.24
          uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check src tests migrations scripts
      - name: Lint
        run: uv run --locked ruff check src tests migrations scripts
      - name: Types
        run: uv run --locked mypy
      - name: Generated contract drift
        run: uv run --locked python scripts/export_contracts.py --check
      - name: Unit, API, PostGIS, replay and migration tests
        run: uv run --locked pytest -q --junitxml=../../artifacts/pytest.xml
      - name: Static security checks
        run: uv run --locked bandit -r src -q
      - name: Audit all locked dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file ../../artifacts/requirements.txt > /dev/null
          uv run --locked pip-audit -r ../../artifacts/requirements.txt --disable-pip --require-hashes --format json --output ../../artifacts/dependency-audit.json
      - name: CI structure and Compose configuration
        run: |
          uv run --locked python scripts/validate_ci.py
          cd ../..
          export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose config --quiet
      - name: Validate workflow syntax
        run: |
          curl --fail --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck= ../../.github/workflows/ci.yml
      - name: Preserve actual gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: citysense-checks
          path: artifacts/
          if-no-files-found: warn
