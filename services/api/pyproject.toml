[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "citysense-core"
version = "0.2.0"
description = "Evidence-first deterministic human-suitability prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "sqlalchemy==2.0.48",
    "opentelemetry-api==1.45.1",
    "python-telegram-bot==22.8",
]
[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.0", "mypy==1.18.2", "pip-audit==2.9.0", "bandit==1.8.6", "pyyaml==6.0.3", "types-PyYAML==6.0.12.20250915", "uv==0.12.24"]
[tool.uv]
required-version = "==0.12.24"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
citysense = ["parameters/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a dedicated PostgreSQL/PostGIS test database"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "migrations"]
