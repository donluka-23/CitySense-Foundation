services:
  db:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citysense}
      POSTGRES_DB: ${POSTGRES_DB:-citysense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local password in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - citysense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  citysense_pgdata:
